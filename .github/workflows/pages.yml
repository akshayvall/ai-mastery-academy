name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js sw.js; do
            node --check "$file"
          done

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Install Microsoft Edge
        run: python -m playwright install --with-deps msedge

      - name: Run standalone browser gate
        run: python tests/browser_smoke.py

      - name: Run beginner learning gate
        run: python tests/browser_units.py

      - name: Run portfolio and source-review gate
        run: python tests/browser_portfolio.py

      - name: Run diagram learning matrix
        run: python tests/browser_diagram_learning.py

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
